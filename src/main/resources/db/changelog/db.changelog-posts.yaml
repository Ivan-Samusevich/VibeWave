databaseChangeLog:
  - changeSet:
      id: create-posts-table
      author: Ivan_Samusevich
      comment: create posts table
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: post_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: varchar(100)
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: likes_count
                  type: int
                  defaultValue: 0
              - column:
                  name: comments_count
                  type: int
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValue: 0
        - addForeignKeyConstraint:
            constraintName: fk_posts_user_id
            baseTableName: posts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id

  - changeSet:
      id: make-post-text-nullable-true
      author: Ivan_Samusevich
      comment: make post text nullable true
      changes:
        - dropNotNullConstraint:
            tableName: posts
            columnName: text
            columnDateType: text