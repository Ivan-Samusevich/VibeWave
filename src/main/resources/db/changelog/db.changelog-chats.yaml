databaseChangeLog:
  - changeSet:
      id: create-chat-table
      author: Ivan_Samusevich
      comment: create chat table
      changes:
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: chat_id
                  type: int
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: first_user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: second_user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: add-users-chats-fk
      author: Ivan_Samusevich
      comment: add users chats fk
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_chats_first-user
            baseTableName: chats
            baseColumnNames: first_user_id
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            constraintName: fk_chats_second-user
            baseTableName: chats
            baseColumnNames: second_user_id
            referencedTableName: users
            referencedColumnNames: user_id
