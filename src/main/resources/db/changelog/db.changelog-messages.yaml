databaseChangeLog:
  - changeSet:
      id: create-messages-table
      author: Ivan_Samusevich
      comment: create messages table
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: message_id
                  type: int
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: chat_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_messages_user
            baseTableName: messages
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: user_id