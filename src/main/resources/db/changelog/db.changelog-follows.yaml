databaseChangeLog:
  - changeSet:
      id: create-follows-table
      author: Ivan_Samusevich
      comment: create follows table
      changes:
        - createTable:
            tableName: follows
            columns:
              - column:
                  name: follow_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: follower_id  #Кто подписан на тебя
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: following_id # На кого подписан ты
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_follows_follower
            baseTableName: follows
            baseColumnNames: follower_id
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            constraintName: fk_follows_following
            baseTableName: follows
            baseColumnNames: following_id
            referencedTableName: users
            referencedColumnNames: user_id