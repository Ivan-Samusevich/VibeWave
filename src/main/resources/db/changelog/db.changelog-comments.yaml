databaseChangeLog:
  - changeSet:
      id: create-comments-table
      author: Ivan_Samusevich
      comment: create comments table
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: comment_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: post_id
                  type: int
                  constraints:
                    nullable: false
              #                - column:
              #                    name: parent_id
              #                    type: int
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_comments_post
            baseTableName: comments
            baseColumnNames: post_id
            referencedTableName: posts
            referencedColumnNames: post_id
        - addForeignKeyConstraint:
            constraintName: fk_comments_users
            baseTableName: comments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id