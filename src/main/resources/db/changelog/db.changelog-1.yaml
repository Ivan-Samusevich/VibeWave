databaseChangeLog:
  - changeSet:
      id: create-user-table
      author: Samusevich_Ivan
      comment: create user table
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp

  - changeSet:
      id: create-userProfile-table
      author: Ivan_Samusevich
      comment: create userProfile table
      changes:
        - createTable:
            tableName: users_profile
            columns:
              - column:
                  name: user_profile_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: avatar_url
                  type: varchar(255)
              - column:
                  name: is_active
                  type: boolean
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_users_profile_user
            baseTableName: users_profile
            baseColumnNames: user_profile_id
            referencedTableName: users
            referencedColumnNames: user_id

  - changeSet:
      id: create-follows-table
      author: Ivan_Samusevich
      comment: create follows table
      changes:
        - createTable:
            tableName: follows
            columns:
              - column:
                  name: follower_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: following_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_follows_follower
            baseTableName: follows
            baseColumnNames: follower_id
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            constraintName: fk_follows_following
            baseTableName: follows
            baseColumnNames: following_id
            referencedTableName: users
            referencedColumnNames: user_id

  - changeSet:
      id: create-posts-table
      author: Ivan_Samusevich
      comment: create posts table
      changes:
          - createTable:
              tableName: posts
              columns:
                - column:
                    name: post_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: caption
                    type: text
                    constraints:
                      nullable: false
                - column:
                    name: location
                    type: varchar(100)
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
                - column:
                    name: updated_at
                    type: timestamp
          - addForeignKeyConstraint:
              constraintName: fk_posts_user_id
              baseTableName: posts
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id

  - changeSet:
      id: create-media-table
      author: Ivan_Samusevich
      comment: create media table
      changes:
          - createTable:
              tableName: media
              columns:
                - column:
                    name: media_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: media_url
                    type: varchar(100)
                    constraints:
                      nullable: false
                - column:
                    name: media_type
                    type: varchar(20)
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_media_post
              baseTableName: media
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id

  - changeSet:
      id: create-likes-table
      author: Ivan_Samusevich
      comment: create likes table
      changes:
          - createTable:
              tableName: likes
              columns:
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_likes_users
              baseTableName: likes
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id
          - addForeignKeyConstraint:
              constraintName: fk_likes_posts
              baseTableName: likes
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id

  - changeSet:
      id: create-comments-table
      author: Ivan_Samusevich
      comment: create comments table
      changes:
          - createTable:
              tableName: comments
              columns:
                - column:
                    name: comment_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: parent_id
                    type: int
                - column:
                    name: content
                    type: text
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_comments_post
              baseTableName: comments
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id
          - addForeignKeyConstraint:
              constraintName: fk_comments_users
              baseTableName: comments
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id
          - addForeignKeyConstraint:
              constraintName: fk_comments_comments
              baseTableName: comments
              baseColumnNames: parent_id
              referencedTableName: comments
              referencedColumnNames: comment_id