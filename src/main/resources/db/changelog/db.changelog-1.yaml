databaseChangeLog:
  - changeSet:
      id: create-user-table
      author: Samusevich_Ivan
      comment: create user table
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp

  - changeSet:
      id: create-userProfile-table
      author: Ivan_Samusevich
      comment: create userProfile table
      changes:
        - createTable:
            tableName: users_profile
            columns:
              - column:
                  name: user_profile_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: avatar_file_name
                  type: varchar(100)
              - column:
                  name: post_count
                  type: int
                  defaultValue: 0
              - column:
                  name: follower_count
                  type: int
                  defaultValue: 0
              - column:
                  name: following_count
                  type: int
                  defaultValue: 0
              - column:
                  name: is_active
                  type: boolean
        - addForeignKeyConstraint:
            constraintName: fk_users_profile_user
            baseTableName: users_profile
            baseColumnNames: user_profile_id
            referencedTableName: users
            referencedColumnNames: user_id

  - changeSet:
      id: create-follows-table
      author: Ivan_Samusevich
      comment: create follows table
      changes:
        - createTable:
            tableName: follows
            columns:
              - column:
                  name: follow_id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: follower_id  #Кто подписан на тебя
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: following_id # На кого подписан ты
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_follows_follower
            baseTableName: follows
            baseColumnNames: follower_id
            referencedTableName: users
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            constraintName: fk_follows_following
            baseTableName: follows
            baseColumnNames: following_id
            referencedTableName: users
            referencedColumnNames: user_id

  - changeSet:
      id: create-posts-table
      author: Ivan_Samusevich
      comment: create posts table
      changes:
          - createTable:
              tableName: posts
              columns:
                - column:
                    name: post_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: file_name
                    type: varchar(100)
                - column:
                    name: text
                    type: text
                    constraints:
                      nullable: false
                - column:
                    name: likes_count
                    type: int
                    defaultValue: 0
                - column:
                    name: comments_count
                    type: int
                    defaultValue: 0
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
                - column:
                    name: updated_at
                    type: timestamp
          - addForeignKeyConstraint:
              constraintName: fk_posts_user_id
              baseTableName: posts
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id

  - changeSet:
      id: create-media-table
      author: Ivan_Samusevich
      comment: create media table
      changes:
          - createTable:
              tableName: media
              columns:
                - column:
                    name: media_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: media_url
                    type: varchar(100)
                    constraints:
                      nullable: false
                - column:
                    name: media_type
                    type: varchar(20)
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_media_post
              baseTableName: media
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id

  - changeSet:
      id: create-likes-table
      author: Ivan_Samusevich
      comment: create likes table
      changes:
          - createTable:
              tableName: likes
              columns:
                - column:
                    name: like_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
                - column:
                    name: updated_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_likes_users
              baseTableName: likes
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id
          - addForeignKeyConstraint:
              constraintName: fk_likes_posts
              baseTableName: likes
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id
              onDelete: CASCADE

  - changeSet:
      id: create-comments-table
      author: Ivan_Samusevich
      comment: create comments table
      changes:
          - createTable:
              tableName: comments
              columns:
                - column:
                    name: comment_id
                    type: int
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
#                - column:
#                    name: parent_id
#                    type: int
                - column:
                    name: text
                    type: text
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
                - column:
                    name: updated_at
                    type: timestamp
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_comments_post
              baseTableName: comments
              baseColumnNames: post_id
              referencedTableName: posts
              referencedColumnNames: post_id
              onDelete: CASCADE
          - addForeignKeyConstraint:
              constraintName: fk_comments_users
              baseTableName: comments
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: user_id
#          - addForeignKeyConstraint:
#              constraintName: fk_comments_comments
#              baseTableName: comments
#              baseColumnNames: parent_id
#              referencedTableName: comments
#              referencedColumnNames: comment_id

  - changeSet:
      id: create-messages-table
      author: Ivan_Samusevich
      comment: create messages table
      changes:
          - createTable:
              tableName: messages
              columns:
                  - column:
                      name: message_id
                      type: int
                      autoIncrement: true
                      constraints:
                        nullable: false
                        primaryKey: true
                  - column:
                      name: chat_id
                      type: int
                      constraints:
                        nullable: false
                  - column:
                      name: sender_id
                      type: int
                      constraints:
                        nullable: false
                  - column:
                      name: text
                      type: text
                      constraints:
                        nullable: false
                  - column:
                      name: created_at
                      type: timestamp
                      constraints:
                        nullable: false
                  - column:
                      name: updated_at
                      type: timestamp
                      constraints:
                        nullable: false
          - addForeignKeyConstraint:
              constraintName: fk_messages_user
              baseTableName: messages
              baseColumnNames: sender_id
              referencedTableName: users
              referencedColumnNames: user_id
  - changeSet:
      id: create-chat-table
      author: Ivan_Samusevich
      comment: create chat table
      changes:
          - createTable:
              tableName: chats
              columns:
                - column:
                    name: chat_id
                    type: int
                    autoIncrement: true
                    constraints:
                      nullable: false
                      primaryKey: true
                - column:
                    name: first_user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: second_user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
                - column:
                    name: updated_at
                    type: timestamp
                    constraints:
                      nullable: false

  - changeSet:
      id: create-saved_posts-table
      author: Ivan_Samusevich
      comment: create saved_posts table
      changes:
          - createTable:
              tableName: saved_posts
              columns:
                - column:
                    name: save_post_id
                    type: int
                    autoIncrement: true
                    constraints:
                      nullable: false
                      primaryKey: true
                - column:
                    name: user_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: post_id
                    type: int
                    constraints:
                      nullable: false
                - column:
                    name: created_at
                    type: timestamp
                    constraints:
                      nullable: false
  - changeSet:
      id: create-fk-saved_posts-with-posts-and-users
      author: Ivan_Samusevich
      comment: create fk saved posts with posts and users
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_saved-posts_post
            baseTableName: saved_posts
            baseColumnNames: post_id
            referencedTableName: posts
            referencedColumnNames: post_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_saved-posts_user
            baseTableName: saved_posts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id